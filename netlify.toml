[[redirects]]
  from = "/fleet"
  to = "/fleet.html"
  status = 200

[[redirects]]
  from = "/fleet.html"
  to = "/fleet"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/rent-local"
  to = "/rent-local.html"
  status = 200

[[redirects]]
  from = "/rent-local.html"
  to = "/rent-local"
  status = 301
  force = true

[[redirects]]
  from = "/blog/same-day-insurance-replacement-rental-black-river-falls"
  to = "/blog/same-day-insurance-replacement-rental-black-river-falls.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/closer-than-you-think-tomah-sparta-neillsville-car-rental"
  to = "/blog/closer-than-you-think-tomah-sparta-neillsville-car-rental.html"
  status = 301
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

# Drafts live in .scheduled/ and must not be served. The splat is at the
# end of the path, which is the form Netlify actually matches.
[[redirects]]
  from = "/.scheduled/*"
  to = "/404"
  status = 404
  force = true

[build.processing.html]
  pretty_urls = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.css]
  bundle = false
  minify = false

# Security + compression headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Vary = "Accept-Encoding"

# Preconnect hints + cache for HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Vary = "Accept-Encoding"
    Link = "<https://fonts.googleapis.com>; rel=preconnect, <https://fonts.gstatic.com>; rel=preconnect; crossorigin, <https://www.googletagmanager.com>; rel=preconnect"

# Long cache for CSS
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    Vary = "Accept-Encoding"

# Long cache for images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Long cache for blog CSS (same stylesheet, different path context)
[[headers]]
  for = "/blog/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Vary = "Accept-Encoding"
    Link = "<https://fonts.googleapis.com>; rel=preconnect, <https://fonts.gstatic.com>; rel=preconnect; crossorigin, <https://www.googletagmanager.com>; rel=preconnect"
