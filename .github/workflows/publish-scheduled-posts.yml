name: Scheduled Post Publisher
on:
  schedule:
    # Runs every Tuesday at 1:17 PM UTC = 8:17 AM Central Time.
    # The :17 minute (not :00) is intentional — GitHub Actions docs
    # warn that scheduled workflows at the start of an hour are
    # skipped during peak load. Off-minute timing is more reliable.
    - cron: '17 13 * * 2'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab
jobs:
  publish-scheduled-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # lastmod is each page's git commit date. The default fetch-depth
          # of 1 hides parent commits, so the tip looks like it added every
          # file and git log dates unchanged pages to that tip. That is what
          # wrote 2026-10-20 onto 37 unchanged URLs in 055eb40. Full history
          # lets the rebuild match scripts/check_site.py.
          fetch-depth: 0
      - name: Publish scheduled posts and wire them in
        run: |
          # Flips .scheduled/blog/*.html.scheduled -> blog/*.html (strips the
          # PUBLISH_DATE header; the public date is the run date) AND updates
          # blog/index.html (article card + Coming Soon teaser removal),
          # the homepage Latest guides block, sitemap.xml (rebuilt: the new post,
          # /blog/, and / get this run's date; every other URL keeps its git
          # commit date), and llms.txt (Live Blog Posts line).
          # Wiring steps are idempotent and non-fatal — a wiring hiccup shows
          # as a ::warning:: in the run log but never blocks publishing.
          COUNT_FILE=/tmp/published_count python3 .github/workflows/wire_in_posts.py
          echo "PUBLISHED_COUNT=$(cat /tmp/published_count)" >> $GITHUB_ENV
      - name: Commit and push published posts
        if: env.PUBLISHED_COUNT > 0
        run: |
          git config user.name "Scheduled Publisher"
          git config user.email "action@github.com"
          # Importing the sitemap builder writes scripts/__pycache__. Do not
          # commit that bytecode with the published post.
          git add -A -- . ':(exclude)scripts/__pycache__'
          git commit -m "Auto-publish + wire in scheduled post(s) — $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
