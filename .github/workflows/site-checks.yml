name: Site checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: UTC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # lastmod is compared to git history; a shallow checkout would
          # date every file to the tip commit.
          fetch-depth: 0
      - name: Sitemap, canonicals, and llms.txt
        run: python3 scripts/check_site.py
      - name: Chat knowledge extraction
        run: python3 scripts/test_chat_knowledge.py
      - name: Chat function guardrails
        run: node --test scripts/test_chat_guardrails.mjs
      - name: Help button still texts when chat is off
        run: python3 scripts/test_help_button.py
      - name: Scheduled publish does not restamp unchanged lastmods
        run: python3 scripts/test_publish_lastmod.py
